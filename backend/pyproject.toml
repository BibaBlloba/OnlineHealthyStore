[project]
name = "FlowerShop"
version = "0.1.0"
description = "description"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standart]>=0.137.0",
    "greenlet>=3.5.1",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[tool.pyright]
executionEnvironments = [{ root = "backend/src/" }]
typeCheckingMode = "off"
venv = ".venv"
venvPath = "."


[tool.ruff]
line-length = 88


[tool.ruff.format]
quote-style = "single"

services:
  frontend:
    restart: always
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - net

  backend:
    restart: always
    container_name: api
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
    volumes:
      - backend_static:/app/backend/static
    networks:
      - net

  postgres:
    restart: always
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "Shop"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Shop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - net

  nginx:
    restart: always
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - backend
      - frontend
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  postgres_data:
  backend_static:
